services:
  - type: web
    name: echoza
    runtime: node
    repo: https://github.com/Arnsgaming8/echoza
    plan: free
    buildCommand: npm install --prefix client && npm run build --prefix client && npm install --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
